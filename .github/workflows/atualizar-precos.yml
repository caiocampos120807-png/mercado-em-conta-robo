
name: Atualizar preços de supermercado

on:
  workflow_dispatch:
  schedule:
    - cron: '17 9 * * *'

permissions:
  contents: write

jobs:
  coletar:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Baixar arquivos
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Testar robô
        run: python -m unittest discover -s tests -v

      - name: Buscar preços
        run: python coletar.py

      - name: Salvar preços
        run: |
          git config user.name 'mercado-em-conta-bot'
          git config user.email 'mercado-em-conta-bot@users.noreply.github.com'
          git add precos.csv status.json
          if ! git diff --cached --quiet; then
            git commit -m 'Atualizacao automatica'
            git push
          fi
